<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - Smart Internship</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="dashboard-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="logo small-logo">
                SI
            </div>

            <div>
                <h5>Smart Internship</h5>
                <small>Student Portal</small>
            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="profile.html"
               class="active">
                👤 My Profile
            </a>

            <a href="internship.html">
                💼 My Internship
            </a>

            <a href="reports.html">
                📝 Weekly Reports
            </a>

            <a href="documents.html">
                📁 Documents
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button onclick="logout()"
                    class="logout-btn">

                🚪 Logout

            </button>

        </div>

    </aside>



    <!-- MAIN -->

    <main class="main-content">


        <header class="topbar">

            <div>

                <h4>My Profile</h4>

                <p>
                    Manage your personal and academic information
                </p>

            </div>

        </header>



        <section class="content-area">


            <div class="dashboard-card">

                <div class="profile-header">

                    <div class="profile-avatar"
                         id="profileAvatar">

                        S

                    </div>

                    <div>

                        <h3 id="profileName">
                            Loading...
                        </h3>

                        <p id="profileEmail">
                            Loading...
                        </p>

                    </div>

                </div>


                <hr>


                <form id="profileForm">

                    <div class="row g-4">


                        <div class="col-md-6">

                            <label>
                                Full Name
                            </label>

                            <input type="text"
                                   id="name"
                                   class="form-control">

                        </div>


                        <div class="col-md-6">

                            <label>
                                Email
                            </label>

                            <input type="email"
                                   id="email"
                                   class="form-control"
                                   readonly>

                        </div>


                        <div class="col-md-6">

                            <label>
                                College
                            </label>

                            <input type="text"
                                   id="college"
                                   class="form-control">

                        </div>


                        <div class="col-md-6">

                            <label>
                                Course
                            </label>

                            <input type="text"
                                   id="course"
                                   class="form-control">

                        </div>


                        <div class="col-md-6">

                            <label>
                                Year
                            </label>

                            <input type="number"
                                   id="year"
                                   class="form-control">

                        </div>


                        <div class="col-md-6">

                            <label>
                                Phone
                            </label>

                            <input type="text"
                                   id="phone"
                                   class="form-control">

                        </div>


                    </div>


                    <div class="mt-4">

                        <button type="submit"
                                class="btn primary-btn">

                            Save Changes

                        </button>

                    </div>


                    <p id="profileMessage"
                       class="message">

                    </p>


                </form>

            </div>


        </section>

    </main>

</div>


<script src="../js/api.js"></script>

<script>

const user =
    JSON.parse(localStorage.getItem("user"));


if (!user) {

    window.location.href = "../login.html";

}


async function loadProfile() {

    try {

        /*
         * Later this API will return the
         * student's profile from MySQL.
         */

        const data =
            await apiRequest("/students/profile");

        document.getElementById("name").value =
            data.name || "";

        document.getElementById("email").value =
            data.email || "";

        document.getElementById("college").value =
            data.college || "";

        document.getElementById("course").value =
            data.course || "";

        document.getElementById("year").value =
            data.year || "";

        document.getElementById("phone").value =
            data.phone || "";

        document.getElementById("profileName").textContent =
            data.name || "Student";

        document.getElementById("profileEmail").textContent =
            data.email || "";

        document.getElementById("profileAvatar").textContent =
            (data.name || "S").charAt(0).toUpperCase();

    }

    catch (error) {

        console.log(error);

        document.getElementById("profileMessage").textContent =
            "Profile API is not connected yet.";

    }

}


document.getElementById("profileForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const profile = {

        name: document.getElementById("name").value,

        college: document.getElementById("college").value,

        course: document.getElementById("course").value,

        year: document.getElementById("year").value,

        phone: document.getElementById("phone").value

    };


    try {

        await apiRequest("/students/profile", {

            method: "PUT",

            body: JSON.stringify(profile)

        });

        document.getElementById("profileMessage")
            .textContent =
            "Profile updated successfully.";

    }

    catch (error) {

        document.getElementById("profileMessage")
            .textContent =
            "Unable to update profile.";

    }

});


loadProfile();


function logout() {

    localStorage.removeItem("user");

    window.location.href =
        "../login.html";

}

</script>

</body>
</html>
