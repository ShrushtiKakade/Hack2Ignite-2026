<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Internship - Smart Internship</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>


<div class="dashboard-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="logo small-logo">
                SI
            </div>

            <div>

                <h5>Smart Internship</h5>

                <small>
                    Student Portal
                </small>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="profile.html">
                👤 My Profile
            </a>

            <a href="internship.html"
               class="active">

                💼 My Internship

            </a>

            <a href="reports.html">
                📝 Weekly Reports
            </a>

            <a href="documents.html">
                📁 Documents
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button onclick="logout()"
                    class="logout-btn">

                🚪 Logout

            </button>

        </div>

    </aside>



    <!-- MAIN -->

    <main class="main-content">


        <header class="topbar">

            <div>

                <h4>My Internship</h4>

                <p>
                    View and manage your internship
                </p>

            </div>

        </header>



        <section class="content-area">


            <div class="dashboard-card">


                <div class="card-header-custom">

                    <div>

                        <h5>
                            Internship Details
                        </h5>

                        <p>
                            Information about your current internship
                        </p>

                    </div>

                </div>


                <div id="internshipContainer">


                    <div class="empty-state">

                        <div class="empty-icon">
                            💼
                        </div>

                        <h5>
                            Loading internship...
                        </h5>

                        <p>
                            Internship information will appear here.
                        </p>

                    </div>


                </div>


            </div>


        </section>

    </main>

</div>



<script src="../js/api.js"></script>


<script>


async function loadInternship() {

    try {

        const internships =
            await apiRequest("/students/internships");


        const container =
            document.getElementById(
                "internshipContainer"
            );


        if (!internships ||
            internships.length === 0) {

            container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        💼
                    </div>

                    <h5>
                        No internship found
                    </h5>

                    <p>
                        Your internship details will appear here.
                    </p>

                </div>

            `;

            return;

        }


        const internship =
            internships[0];


        container.innerHTML = `

            <div class="row g-4">

                <div class="col-md-6">

                    <div class="info-item">

                        <span>Company</span>

                        <strong>
                            ${internship.company || "-"}
                        </strong>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="info-item">

                        <span>Role</span>

                        <strong>
                            ${internship.role || "-"}
                        </strong>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="info-item">

                        <span>Internship Type</span>

                        <strong>
                            ${internship.internshipType || "-"}
                        </strong>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="info-item">

                        <span>Status</span>

                        <strong>
                            ${internship.status || "-"}
                        </strong>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="info-item">

                        <span>Start Date</span>

                        <strong>
                            ${internship.startDate || "-"}
                        </strong>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="info-item">

                        <span>End Date</span>

                        <strong>
                            ${internship.endDate || "-"}
                        </strong>

                    </div>

                </div>

            </div>

        `;

    }

    catch (error) {

        console.log(error);

        document.getElementById(
            "internshipContainer"
        ).innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h5>
                    Internship API not connected
                </h5>

                <p>
                    Backend integration will be completed soon.
                </p>

            </div>

        `;

    }

}


loadInternship();


function logout() {

    localStorage.removeItem("user");

    window.location.href =
        "../login.html";

}

</script>


</body>
</html>
